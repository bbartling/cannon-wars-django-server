<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pop The Lock JS</title>
  <style>
    body {
      background: #111;
      color: white;
      text-align: center;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    canvas {
      background: #222;
      display: block;
      margin: 20px auto;
      border: 2px solid #555;
    }
    h1 {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Pop the Lock JS</h1>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const center = { x: 200, y: 200 };
    const radius = 100;
    let angle = 0;
    let speed = 0.05;
    let targetAngle = Math.random() * 2 * Math.PI;
    let score = 0;
    let gameOver = false;

    function drawCircle() {
      ctx.beginPath();
      ctx.arc(center.x, center.y, radius, 0, 2 * Math.PI);
      ctx.strokeStyle = "white";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function drawTarget() {
      const x = center.x + radius * Math.cos(targetAngle);
      const y = center.y + radius * Math.sin(targetAngle);
      ctx.beginPath();
      ctx.arc(x, y, 8, 0, 2 * Math.PI);
      ctx.fillStyle = "yellow";
      ctx.fill();
    }

    function drawBar() {
      const x = center.x + radius * Math.cos(angle);
      const y = center.y + radius * Math.sin(angle);
      ctx.beginPath();
      ctx.arc(x, y, 6, 0, 2 * Math.PI);
      ctx.fillStyle = "red";
      ctx.fill();
    }

    function update() {
      if (!gameOver) {
        angle += speed;
        if (angle > 2 * Math.PI) angle -= 2 * Math.PI;
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawCircle();
      drawTarget();
      drawBar();
      ctx.fillStyle = "white";
      ctx.font = "16px Arial";
      ctx.fillText(`Score: ${score}`, 10, 20);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    canvas.addEventListener("click", () => {
      if (gameOver) return;
      const diff = Math.abs(angle - targetAngle);
      if (diff < 0.15 || diff > 2 * Math.PI - 0.15) {
        score++;
        targetAngle = Math.random() * 2 * Math.PI;
        speed += 0.005;
      } else {
        gameOver = true;
        setTimeout(() => {
          alert("Game Over! Final Score: " + score);
        }, 100);
      }
    });

    loop();
  </script>
</body>
</html>
