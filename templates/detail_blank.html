{% extends "base.html" %}
{% load static %}
{% block title %}{{ game.title }} — Bens Physics Hub Sims{% endblock %}
{% block content %}
  <h1>{{ game.title }}</h1>

  <img src="{{ game.thumbnail.url }}" alt="Simulation thumbnail"
       style="max-width: 720px; width: 100%; border-radius: 12px; filter:saturate(0.95) contrast(1.05);">

  <p class="subtle" style="margin-top:10px">{{ game.short_desc }}</p>

  <p><a class="btn" href="{% url 'home' %}">← Back</a></p>
{% endblock %}
