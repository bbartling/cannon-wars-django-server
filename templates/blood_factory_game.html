<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blood Factory</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      background: black;
      color: white;
    }
    canvas {
      display: block;
      background: white;
    }
  </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<!-- The Module object triggers startBloodFactoryGame on initialization.  -->
<script>
  // Define the Module object up front.  The onRuntimeInitialized
  // callback will be invoked once either the emscripten glue code or
  // our fallback triggers initialization.  To prevent duplicate
  // startups (which can occur if both the glue code and our
  // fallback call it), we set a flag on Module._bfStarted the first
  // time it runs.
  var Module = {
    onRuntimeInitialized: function() {
      if (Module._bfStarted) return;
      Module._bfStarted = true;
      console.log("🩸 Blood Factory module ready");
      if (typeof startBloodFactoryGame === 'function') {
        startBloodFactoryGame();
      } else {
        console.warn('startBloodFactoryGame() is not yet defined');
      }
    }
  };
</script>

<!-- Stub loader (or real Wasm) -->
<script src="{{ url_for('static', filename='blood_factory.js') }}"></script>
<!-- Game logic and rendering -->
<script src="{{ url_for('static', filename='blood_factory_game.js') }}"></script>

</body>
</html>
