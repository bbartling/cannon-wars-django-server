<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Pop The Lock — Leaderboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="topbar">
    <a href="{{ url_for('home') }}">⬅️ Home</a>
    <a href="{{ url_for('pop_the_lock') }}">🔐 Play Pop The Lock</a>
  </div>

  <h1 class="text-center mt-half">Pop The Lock — Leaderboard</h1>
  <table class="board">
    <thead>
      <tr><th class="rank">#</th><th>Name</th><th class="score">Score</th><th class="when">When (UTC)</th></tr>
    </thead>
    <tbody>
      {% if rows %}
        {% for r in rows %}
          <tr>
            <td class="rank">{{ loop.index }}</td>
            <td>{{ r.name }}</td>
            <td class="score">{{ r.score }}</td>
            <td class="when">{{ r.ts }}</td>
          </tr>
        {% endfor %}
      {% else %}
        <tr><td colspan="4" class="no-scores">No scores yet — be the first to win!</td></tr>
      {% endif %}
    </tbody>
  </table>
</body>
</html>
