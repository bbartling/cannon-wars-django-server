{% extends 'base.html' %}

{% block title %}Confirm your email{% endblock %}

{% block content %}
<h1>Confirm your email</h1>
<p>Enter your email. We'll send you a link to confirm, then you'll set a password.</p>
<form method="post">
  {% csrf_token %}
  {{ form.email.label_tag }}<br>
  {{ form.email }}<br><br>
  <button type="submit">Send link</button>
</form>
{% endblock %}
