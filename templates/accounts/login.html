{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<h1>Login</h1>
<form method="post">
  {% csrf_token %}
  {{ form.username.label_tag }}<br>
  {{ form.username }}<br><br>
  {{ form.password.label_tag }}<br>
  {{ form.password }}<br><br>
  <button type="submit">Login</button>
</form>
{% endblock %}
