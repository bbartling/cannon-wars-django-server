{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in — Unity Physics Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="{% static 'home.css' %}">
</head>
<body>
<header class="topbar"><div class="brand">Unity Physics Hub</div></header>
<main class="wrap">
  <h1>Sign in</h1>
  {% if form.errors %}
    <p class="subtle">Invalid username/password — please try again.</p>
  {% endif %}
  <form method="post" class="inner" style="background:#12131a;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:16px;max-width:480px">
    {% csrf_token %}
    <p>
      <label for="id_username">Username</label><br>
      {{ form.username }}
    </p>
    <p>
      <label for="id_password">Password</label><br>
      {{ form.password }}
    </p>
    <p><button class="btn" type="submit">Sign in</button></p>
    <input type="hidden" name="next" value="{{ next }}">
  </form>
</main>
</body>
</html>
