{% extends 'base.html' %}
{% load static %}

{% block title %}Pop the Lock{% endblock %}

{% block content %}
<div class="game-page">
  <canvas id="gameCanvas"></canvas>
  {# Preload pop sounds #}
  {% for i in range15 %}
  <audio id="popSound{{ i }}" src="{% static 'games/pop_the_lock/' %}{{ i }}_pop_the_lock.mp3" preload="auto"></audio>
  {% endfor %}
  <audio id="winSound" src="{% static 'games/pop_the_lock/game-level-complete.mp3' %}" preload="auto"></audio>
</div>
<script>
  var Module = {
    onRuntimeInitialized: function() {
      console.log("✅ Pop the Lock WASM module ready");
      if (typeof startPopTheLockGame === 'function') {
        startPopTheLockGame();
      }
    }
  };
</script>
<script src="{% static 'games/pop_the_lock/pop_the_lock.js' %}"></script>
<script src="{% static 'games/pop_the_lock/pop_the_lock_game.js' %}"></script>
{% include 'partials/comments.html' with slug=slug comments=comments %}
{% endblock %}
