{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cannon Wars</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh; margin: 0;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        color: #f1f5f9;
      }
      .card {
        text-align: center; padding: 2.5rem;
        border-radius: 1rem; background: #111827;
        box-shadow: 0 12px 35px rgba(0,0,0,0.5);
        max-width: 640px;
      }
      h1 {
        margin: 0 0 0.5rem; font-size: 2.5rem;
        color: #38bdf8; text-shadow: 0 2px 6px rgba(0,0,0,0.4);
      }
      p.tagline {
        margin: 0 0 1.5rem; font-size: 1.2rem;
        color: #cbd5e1; font-style: italic;
      }
      img {
        width: min(500px, 85vw); height: auto;
        border-radius: 0.75rem;
        display: block; margin: 0 auto 1.5rem;
      }
      a.play {
        display: inline-block; margin-top: 0.75rem;
        padding: 0.85rem 1.5rem; font-size: 1.1rem;
        border-radius: 0.75rem; background: #22c55e;
        color: #0b1320; text-decoration: none; font-weight: 700;
        box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
        transition: transform 0.15s ease, background 0.2s;
      }
      a.play:hover {
        transform: translateY(-2px);
        background: #16a34a;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Welcome to Cannon Wars!</h1>
      <p class="tagline">Explosive battles, sharp aim, endless fun.</p>
      <img src="{% static 'thumbnail.png' %}" alt="Game Thumbnail">
      <div><a class="play" href="/play/">▶ Play Now</a></div>
    </div>
  </body>
</html>
